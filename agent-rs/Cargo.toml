[package]
name = "fleet-ota-agent"
version = "0.1.0"
edition = "2021"
description = "On-device A/B OTA agent (Rust). Wire-compatible with the Go tools in ../ota"
publish = false

[dependencies]
ed25519-dalek = "2.1"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
tempfile = "3"

[profile.release]
opt-level = "z"     # small binary for the Pi
lto = true
codegen-units = 1
panic = "abort"
strip = true
